name: Verify WorkScene
on:
  push:
    branches: ["feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  core-and-package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:extension
      - if: runner.os == 'macOS'
        run: npx electron-builder --mac dir zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: workscene-${{ runner.os }}
          path: |
            release/*.vsix
            release/*.zip
          if-no-files-found: error
